# =========================================================================
# Production Nginx Configuration for Kozker (https://kozker.com)
# HTTP/2, HTTP/3 (QUIC), Brotli, Gzip, and Canonical 301 Redirects
# =========================================================================

# 1. HTTP to HTTPS 301 Redirect
server {
    listen 80;
    listen [::]:80;
    server_name kozker.com www.kozker.com;
    return 301 https://kozker.com$request_uri;
}

# 2. WWW to Non-WWW HTTPS 301 Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kozker.com;

    ssl_certificate /etc/letsencrypt/live/kozker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kozker.com/privkey.pem;

    return 301 https://kozker.com$request_uri;
}

# 3. Main Canonical Server Block (https://kozker.com)
server {
    # HTTP/2 and HTTP/3 (QUIC)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    server_name kozker.com;

    root /var/www/kozker/dist;
    index index.html;

    # SSL Settings
    ssl_certificate /etc/letsencrypt/live/kozker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kozker.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HTTP/3 QUIC Alt-Svc advertisement header
    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header QUIC-Status $http3;

    # Security Headers (HSTS & Anti-clickjacking)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Modern Server Compression: Brotli (with pre-compressed static fallback)
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

    # Gzip Compression Fallback (with pre-compressed static fallback)
    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

    # Trailing Slash Normalization: 301 Redirect /path/ to /path (excluding root /)
    rewrite ^/(.+)/$ /$1 permanent;

    # Case Standardization: 301 Permanent Redirect uppercase route variations to lowercase
    location ~* ^/(about|services|products|work|partners|contact|admin)/?$ {
        if ($uri !~ ^/(about|services|products|work|partners|contact|admin)$) {
            return 301 https://kozker.com/$1$is_args$args;
        }
    }

    # Long-term Caching for Hashed Static Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML Document Shell with Edge & Crawler SWR Caching
    location = /index.html {
        add_header Cache-Control "public, max-age=60, s-maxage=3600, stale-while-revalidate=86400" always;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
